name: Disable Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  disable-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAJJAR_PUBLIC_SITE }}

      - name: Disable Firebase Hosting
        run: npx --yes firebase-tools@latest hosting:disable --project najjar-website --force --non-interactive
